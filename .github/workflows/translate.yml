name: Translate Markdown

on:
  push:
    branches:
      - main
    paths:
      - 'README.md' # Pfad zu deiner Quelldatei

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Erlaubt das Committen der übersetzten Datei

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Translate Markdown
        uses: meysamhadeli/codex-translator@v1 # Verwendet DeepL / LLM zur Übersetzung
        with:
          api_key: ${{ secrets.DEEPL_API_KEY }}
          source_file: 'README.md'
          target_file: 'README.en.md'
          target_lang: 'EN'

      - name: Commit translated file
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update automatic translation [skip ci]"
